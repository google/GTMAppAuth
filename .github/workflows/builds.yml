name: Build GTMAppAuth for Valid Architectures

on:
  schedule:
    - cron: '0 8 * * *' # Cron uses UTC; run at nightly at midnight PST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cron:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
  
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Archive for iOS
      run: |
        xcodebuild \
          archive \
          -scheme GTMAppAuth \
          -destination "generic/platform=iOS"
    - name: Archive for macOS
      run: |
        xcodebuild \
          archive \
          -scheme GTMAppAuth \
          -destination "platform=OS X"
    - name: Archive for watchOS
      run: |
        xcodebuild \
          archive \
          -scheme GTMAppAuth \
          -destination "generic/platform=watchOS"
    - name: Archive for tvOS
      run: |
        xcodebuild \
          archive \
          -scheme GTMAppAuth \
          -destination "generic/platform=tvOS"

  xcode-27-preview-archive:
    # Archive every supported platform against the Xcode 27 preview image. The
    # image is preview, so this job does not block merges.
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        destination: [
          'generic/platform=iOS',
          'platform=OS X',
          'generic/platform=watchOS',
          'generic/platform=tvOS'
        ]

    steps:
    - uses: actions/checkout@v3
    - name: Archive
      run: |
        xcodebuild \
          archive \
          -scheme GTMAppAuth \
          -destination "${{ matrix.destination }}"
